<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-commerce Profit Calculator</title>
<style>
    * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { 
        background: #0f172a; 
        margin: 0; 
        padding: 15px; 
        color: #f8fafc; 
        padding-bottom: 80px; 
    }
    .container { 
        max-width: 480px; 
        margin: 0 auto; 
        background: #1e293b; 
        padding: 24px; 
        border-radius: 16px; 
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5); 
        border: 1px solid #334155;
    }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { font-size: 20px; margin: 0; color: #f8fafc; font-weight: 700; letter-spacing: -0.5px; }
    .btn-view { 
        background: #3b82f6; 
        color: #ffffff; 
        border: none; 
        padding: 8px 14px; 
        border-radius: 8px; 
        font-weight: 600; 
        cursor: pointer; 
        font-size: 12px; 
        transition: background 0.2s;
    }
    .btn-view:hover { background: #2563eb; }

    /* Highlights Summary Card */
    .summary-box { 
        display: flex; 
        justify-content: space-between; 
        background: #0f172a; 
        padding: 16px; 
        border-radius: 12px; 
        margin-bottom: 24px; 
        text-align: center; 
        border: 1px solid #334155;
    }
    .summary-item h4 { margin: 0; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-item p { margin: 6px 0 0; font-size: 20px; font-weight: 800; }

    .profit-positive { color: #4ade80; }
    .profit-negative { color: #f87171; }

    .form-group { margin-bottom: 14px; }
    label { font-size: 12px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input { 
        width: 100%; 
        padding: 12px; 
        background: #0f172a; 
        border: 1px solid #334155; 
        border-radius: 8px; 
        font-size: 15px; 
        color: #f8fafc; 
        outline: none; 
        transition: border-color 0.2s;
        scroll-margin-bottom: 100px; 
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

    .btn-save { 
        width: 100%; 
        padding: 14px; 
        background: #22c55e; 
        color: #ffffff; 
        border: none; 
        border-radius: 8px; 
        font-size: 15px; 
        font-weight: 700; 
        cursor: pointer; 
        margin-top: 12px; 
        transition: background 0.2s;
    }
    .btn-save:hover { background: #16a34a; }
    
    /* Ad Banner Container */
    .ad-banner { 
        width: 100%; 
        max-width: 480px; 
        height: 60px; 
        background: #0f172a; 
        border: 1px dashed #475569; 
        margin: 20px auto 0; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        color: #64748b; 
        font-size: 12px; 
        border-radius: 8px; 
    }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-content { background: #1e293b; padding: 20px; border-radius: 14px; width: 90%; max-width: 450px; max-height: 80vh; overflow-y: auto; border: 1px solid #334155; color: #f8fafc; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; font-weight: bold; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 12px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #cbd5e1; }
    .btn-delete { background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
</style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <h2>Profit Calculator</h2>
        <button class="btn-view" onclick="openModal()">Saved Products (<span id="savedCount">0</span>)</button>
    </div>

    <div class="summary-box">
        <div class="summary-item">
            <h4>NET PROFIT</h4>
            <p id="netProfitDisplay" class="profit-positive">₹0.00</p>
        </div>
        <div class="summary-item">
            <h4>MARGIN</h4>
            <p id="marginDisplay" class="profit-positive">0.0%</p>
        </div>
    </div>

    <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="pName" value="New Product">
    </div>
    <div class="form-group">
        <label>Buying Price (₹)</label>
        <input type="tel" id="buyingPrice" value="100" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Selling Price (₹)</label>
        <input type="tel" id="sellingPrice" value="200" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Platform Commission (₹)</label>
        <input type="tel" id="marketplaceCost" value="10" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>GST (%)</label>
        <input type="tel" id="gst" value="18" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Shipping Charge (₹)</label>
        <input type="tel" id="shippingCharge" value="69" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Packaging Cost (₹)</label>
        <input type="tel" id="packagingCost" value="10" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Payment Fee (₹)</label>
        <input type="tel" id="paymentFee" value="5" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Return/RTO Cost (₹)</label>
        <input type="tel" id="returnCost" value="15" oninput="calculate()">
    </div>
    <div class="form-group">
        <label>Other Expenses (₹)</label>
        <input type="tel" id="otherExpenses" value="0" oninput="calculate()">
    </div>

    <button class="btn-save" onclick="saveProduct()">Save Product</button>

    <div class="ad-banner">
        [ Google AdSense / AdMob Banner Space ]
    </div>
</div>

<div class="modal" id="savedModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 style="margin:0;">Saved Products</h3>
            <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Profit</th>
                        <th>Margin</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('savedProducts')) || [];

    function calculate() {
        let buying = parseFloat(document.getElementById('buyingPrice').value) || 0;
        let selling = parseFloat(document.getElementById('sellingPrice').value) || 0;
        let market = parseFloat(document.getElementById('marketplaceCost').value) || 0;
        let gstPercent = parseFloat(document.getElementById('gst').value) || 0;
        let shipping = parseFloat(document.getElementById('shippingCharge').value) || 0;
        let packaging = parseFloat(document.getElementById('packagingCost').value) || 0;
        let payFee = parseFloat(document.getElementById('paymentFee').value) || 0;
        let returnFee = parseFloat(document.getElementById('returnCost').value) || 0;
        let other = parseFloat(document.getElementById('otherExpenses').value) || 0;

        let gstAmount = (selling * gstPercent) / 100;
        let totalCost = buying + market + gstAmount + shipping + packaging + payFee + returnFee + other;
        let netProfit = selling - totalCost;
        let margin = selling > 0 ? (netProfit / selling) * 100 : 0;

        let profitEl = document.getElementById('netProfitDisplay');
        let marginEl = document.getElementById('marginDisplay');

        profitEl.innerText = "₹" + netProfit.toFixed(2);
        marginEl.innerText = margin.toFixed(1) + "%";

        if (netProfit >= 0) {
            profitEl.className = "profit-positive";
            marginEl.className = "profit-positive";
        } else {
            profitEl.className = "profit-negative";
            marginEl.className = "profit-negative";
        }

        return { selling, totalCost, netProfit, margin };
    }

    function renderTable() {
        let tbody = document.getElementById('productTableBody');
        tbody.innerHTML = '';
        products.forEach((p, index) => {
            let row = `<tr>
                <td>${p.name}</td>
                <td>₹${p.selling}</td>
                <td class="${p.profit >= 0 ? 'profit-positive' : 'profit-negative'}">₹${p.profit.toFixed(2)}</td>
                <td class="${p.margin >= 0 ? 'profit-positive' : 'profit-negative'}">${p.margin.toFixed(1)}%</td>
                <td><button class="btn-delete" onclick="deleteProduct(${index})">X</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });
        document.getElementById('savedCount').innerText = products.length;
    }

    function saveProduct() {
        let name = document.getElementById('pName').value || "New Product";
        let calc = calculate();
        products.push({
            name: name,
            selling: calc.selling,
            cost: calc.totalCost,
            profit: calc.netProfit,
            margin: calc.margin
        });
        localStorage.setItem('savedProducts', JSON.stringify(products));
        renderTable();
        alert("Product Saved Successfully!");
    }

    function deleteProduct(index) {
        products.splice(index, 1);
        localStorage.setItem('savedProducts', JSON.stringify(products));
        renderTable();
    }

    function openModal() {
        document.getElementById('savedModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('savedModal').style.display = 'none';
    }

    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            setTimeout(() => {
                input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        });
    });

    calculate();
    renderTable();
</script>

</body>
</html>
